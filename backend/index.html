<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      background: #f7f7f7;
    }

    .card {
      background: #fff;
      width: 300px;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .loading, .error {
      font-size: 18px;
      font-weight: bold;
    }

  </style>
</head>
<body>

  <div id="card-container">
    <p class="loading">Loading...</p>
  </div>

  <script src="index.js"></script>

</body>
</html>
